name: Build VSIX

# Visual Studio 版的宿主是 C#（net48 + VSSDK），只能在 Windows 上打包。
# 开发机是 macOS 时这里就是唯一的编译验证途径，所以这个 workflow 同时承担「能不能编过」的职责。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vsix:
    # 固定 windows-2022：镜像里带 VS 2022 Enterprise 与 VisualStudioExtension 工作负载
    # （含 VSSDK 的 vsct.exe / CreateVsixContainer 目标），不用现装。
    # 不用 windows-latest，防止 runner 大版本漂移后工具链对不上。
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必须排在 msbuild 前面：compile 里的 clean 会删掉 dist，
      # 而后面的 msbuild 要靠 dist/webviews 打进 vsix。
      - name: Build webviews
        run: npm run compile

      - name: Verify webview assets
        shell: pwsh
        run: |
          $apps = @('tetris', 'snake', 'gomoku', 'ssh')
          foreach ($app in $apps) {
            $index = "dist/webviews/$app/index.html"
            if (-not (Test-Path $index)) { throw "缺少前端产物：$index" }
          }

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere：$vswhere" }
          # 通配会命中多条（amd64 / x86 / arm64 各一份），取第一条
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                               -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "vswhere 没有找到 MSBuild" }
          # PowerShell 5.1 的 -Encoding utf8 会写 BOM，GITHUB_ENV 解析不了第一行，必须用 ascii
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "MSBuild: $msbuild"

      - name: Build VSIX
        shell: pwsh
        run: |
          # 版本号取 package.json 的 version 补一段，凑成 vsix 要求的四段式
          $version = (node -p "require('./package.json').version") + ".0"
          Write-Host "VsixVersion: $version"
          # 传给下一步对账。下一个步骤是独立进程，变量不跨步骤，只能走 GITHUB_ENV
          # （同 MSBUILD 那条，PowerShell 5.1 写 utf8 会带 BOM，GITHUB_ENV 解析不了）
          "VSIX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          & $env:MSBUILD src/visualstudio/RaccoonVS.sln -restore -nologo `
              -p:Configuration=Release -p:VsixVersion=$version -p:DeployExtension=false
          if ($LASTEXITCODE -ne 0) { throw "VSIX 构建失败（退出码 $LASTEXITCODE）" }

      # 内容自检：WebView2 的 native loader 是否能被打进 vsix，是安装后能不能启动的关键。
      # 缺了它，VS 里打开面板会直接报 WebView2 初始化失败。
      - name: Verify VSIX contents
        shell: pwsh
        run: |
          $vsix = Get-ChildItem src/visualstudio/RaccoonVS/bin/Release -Filter *.vsix -Recurse |
                  Select-Object -First 1
          if (-not $vsix) { throw "没有产出 vsix" }
          Write-Host "VSIX: $($vsix.FullName)"

          # Windows 自带 bsdtar，vsix 是 zip，-tf 能直接列出条目
          $entries = & tar -tf $vsix.FullName
          $webviewCount = ($entries | Where-Object { $_ -like "dist/webviews/*" }).Count
          Write-Host "前端产物条目数：$webviewCount"

          if ($webviewCount -lt 4) { throw "vsix 里没有打进 dist/webviews" }

          if (-not ($entries | Where-Object { $_ -like "*WebView2Loader.dll" })) {
            throw "vsix 里没有 WebView2Loader.dll，WebView2 起不来"
          }

          # 清单版本号。打包时 csproj 的 StampVsixVersion 把 __VSIX_VERSION__ 换成上面那个
          # 版本号——不换的话 vsix 装不上，报 InvalidExtensionManifestException「版本字符串
          # 部分太短或太长」，而打包那一步是完全成功的，错误要等安装才炸。所以从打好的包里
          # 读回来对一遍，算是端到端验证（csproj 里想断言但没法断言：MSBuild 的字符串函数要求
          # 把内容拼进条件表达式，清单里有个单引号就会把条件解析搞崩）。
          $manifestDir = Join-Path $env:RUNNER_TEMP "vsix-manifest"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          & tar -xf $vsix.FullName -C $manifestDir extension.vsixmanifest
          if ($LASTEXITCODE -ne 0) { throw "从 vsix 里解不出 extension.vsixmanifest" }

          $manifest = Get-Content (Join-Path $manifestDir "extension.vsixmanifest") -Raw
          if ($manifest -match "__VSIX_VERSION__") {
            throw "包内清单还留着 __VSIX_VERSION__ 占位符，替版本号那步没生效"
          }
          # 包内的清单会被 XML 重新序列化（Identity 挤成一行、设计期属性剥掉），
          # 但属性顺序不变，Version 仍在 Id 之后
          $m = [regex]::Match($manifest, '<Identity[^>]*?\sVersion="([^"]+)"')
          if (-not $m.Success) { throw "包内清单里找不到 Identity/@Version" }
          if ($m.Groups[1].Value -ne $env:VSIX_VERSION) {
            throw "版本号不符：包内是 $($m.Groups[1].Value)，期望 $env:VSIX_VERSION"
          }
          Write-Host "包内清单版本号：$($m.Groups[1].Value)"

          # Asset 的 Path 是 |%CurrentProject%;PkgdefProjectOutputGroup|，靠 Detokenize 解析成
          # pkgdef 文件名。解析不出来扩展装上了也加载不了，而清单本身语法完全合法，一样是
          # 「打包成功、装载才炸」那一类
          if ($manifest -notmatch "RaccoonVS\.pkgdef") {
            throw "包内清单的 Asset 没解析出 RaccoonVS.pkgdef"
          }

          Write-Host "自检通过，共 $($entries.Count) 个条目"

      # 菜单表必须真的在程序集里，否则「工具」菜单下不会出现任何入口。
      #
      # VSCTCompile 产出的 .cto 由外部工具 VsixUtil.exe mergeCto 作为一条名为 Menus.ctmenu
      # 的内嵌资源写进 RaccoonVS.dll（见 CtoMerger：ResourceWriter.AddResource(ctoFile.ResourceName,
      # bytes)，ResourceName 来自 csproj 的 <VSCTCompile><ResourceName>）。这条链断掉时的症状
      # 具有极强的误导性：打包成功、vsix 能装、管理扩展里列得出来、pkgdef 和清单也都正常——
      # 只是 VS 里一个入口都没有，看起来像 VS 的问题。
      #
      # 单开一个步骤且用 powershell（5.1，.NET Framework）而不是上面的 pwsh：
      # pwsh 跑在 .NET Core 上，载入 net48 程序集不保证成。
      #
      # 代价是这个步骤的 run 里**只能写 ASCII**，一个中文都不能有。
      # 5.1 读脚本文件用的是系统 ANSI 代码页，而本文件是无 BOM 的 UTF-8：
      # 中文会被逐字节读成高位乱码，乱码里若正好凑出引号就把字符串截断，
      # 整段变成语法错误——第一步 push 就是这么挂的，报错还长成「字符串缺少终止符」，
      # 看着像引号写错，其实是编码。解释所以写在 YAML 注释里（注释不进脚本），
      # 脚本内的字符串一律英文。
      - name: Verify ctmenu resource in assembly
        shell: powershell
        run: |
          $dll = "src/visualstudio/RaccoonVS/bin/Release/net48/RaccoonVS.dll"
          if (-not (Test-Path $dll)) { throw "not found: $dll" }
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path $dll).Path)
          $found = $false
          foreach ($name in $asm.GetManifestResourceNames()) {
            $stream = $asm.GetManifestResourceStream($name)
            try {
              $reader = New-Object System.Resources.ResourceReader $stream
              foreach ($entry in $reader) { if ($entry.Key -eq "Menus.ctmenu") { $found = $true } }
              $reader.Close()
            } catch { }
          }
          if (-not $found) { throw "RaccoonVS.dll does not embed Menus.ctmenu - the command table was not merged in, so the extension installs without any menu entry." }
          Write-Host "ctmenu resource merged into RaccoonVS.dll"

      - name: Package VS Code extension
        run: npx @vscode/vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-vscode
          path: "*.vsix"
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-visualstudio
          path: src/visualstudio/RaccoonVS/bin/Release/**/*.vsix
          if-no-files-found: error
